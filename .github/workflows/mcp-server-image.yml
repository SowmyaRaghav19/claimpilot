# Builds the MCP server container image and publishes it to GitHub Container Registry (free).
name: mcp-server image

on:
  push:
    branches: [main]
    paths: ["mcp-server/**", ".github/workflows/mcp-server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: true
          tags: |
            ghcr.io/sowmyaraghav19/claimpilot-mcp-server:latest
            ghcr.io/sowmyaraghav19/claimpilot-mcp-server:${{ github.sha }}
